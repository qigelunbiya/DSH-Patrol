name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check browser extension
        run: pnpm check:extension

      - name: Check UTF-8 and Chinese text
        run: pnpm check:encoding

      - name: Build
        run: pnpm build

      - name: Pack smoke test
        run: |
          mkdir -p .pack-check
          pnpm pack --pack-destination .pack-check
          PKG="$(find .pack-check -name 'dsh-patrol-*.tgz' -print -quit)"
          test -n "$PKG"
          tar -tzf "$PKG" > .pack-check/contents.txt
          grep -qx 'package/browser-bridge-runtime/index.js' .pack-check/contents.txt
          grep -qx 'package/browser-bridge-runtime/managed-browser.js' .pack-check/contents.txt
          grep -qx 'package/browser-bridge-runtime/tools-plugin.js' .pack-check/contents.txt
          grep -qx 'package/browser-extension/manifest.json' .pack-check/contents.txt
          grep -qx 'package/presets/patrol/preset.yml' .pack-check/contents.txt
          grep -qx 'package/presets/patrol/agent.cordis.yml' .pack-check/contents.txt
          grep -qx 'package/scripts/install-local.ps1' .pack-check/contents.txt
          grep -qx 'package/scripts/uninstall-local.ps1' .pack-check/contents.txt
