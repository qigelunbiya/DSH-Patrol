name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check browser extension
        run: pnpm check:extension

      - name: Check Python runtime syntax
        run: python -m py_compile browser-bridge-runtime/captcha-demo-solver.py browser-bridge-runtime/qr-decode.py excel-runtime/openxml_bridge.py

      - name: Check UTF-8 and Chinese text
        run: pnpm check:encoding

      - name: Build
        run: pnpm build

      - name: Pack smoke test
        run: |
          mkdir -p .pack-check
          pnpm pack --pack-destination .pack-check
          PKG="$(find .pack-check -name 'dsh-patrol-*.tgz' -print -quit)"
          test -n "$PKG"
          tar -tzf "$PKG" > .pack-check/contents.txt
          grep -qx 'package/lib/index.js' .pack-check/contents.txt
          grep -qx 'package/lib/index.d.ts' .pack-check/contents.txt
          grep -qx 'package/lib/preset-installer.js' .pack-check/contents.txt
          grep -qx 'package/browser-bridge-runtime/index.js' .pack-check/contents.txt
          grep -qx 'package/browser-bridge-runtime/managed-browser.js' .pack-check/contents.txt
          grep -qx 'package/browser-bridge-runtime/tools-plugin.js' .pack-check/contents.txt
          grep -qx 'package/desktop-runtime/tools-plugin.js' .pack-check/contents.txt
          grep -qx 'package/desktop-runtime/windows-driver.js' .pack-check/contents.txt
          grep -qx 'package/desktop-runtime/windows-desktop.ps1' .pack-check/contents.txt
          grep -qx 'package/desktop-knowledge/微信.md' .pack-check/contents.txt
          grep -qx 'package/browser-bridge-runtime/captcha-demo.js' .pack-check/contents.txt
          grep -qx 'package/browser-bridge-runtime/captcha-demo-solver.py' .pack-check/contents.txt
          grep -qx 'package/browser-bridge-runtime/qr-decode.py' .pack-check/contents.txt
          grep -qx 'package/browser-bridge-runtime/qr-code.js' .pack-check/contents.txt
          grep -qx 'package/browser-bridge-runtime/image-code-ddddocr.js' .pack-check/contents.txt
          grep -qx 'package/browser-bridge-runtime/transient-tool.js' .pack-check/contents.txt
          grep -qx 'package/excel-runtime/openxml_bridge.py' .pack-check/contents.txt
          grep -qx 'package/browser-extension/manifest.json' .pack-check/contents.txt
          grep -qx 'package/browser-extension/captcha-demo-content.js' .pack-check/contents.txt
          grep -qx 'package/cleanup-runtime/index.js' .pack-check/contents.txt
          grep -qx 'package/presets/patrol/preset.yml' .pack-check/contents.txt
          grep -qx 'package/presets/patrol/agent.cordis.yml' .pack-check/contents.txt
          grep -qx 'package/scripts/install-local.ps1' .pack-check/contents.txt
          grep -qx 'package/scripts/install-captcha-demo.ps1' .pack-check/contents.txt
          grep -qx 'package/scripts/uninstall-local.ps1' .pack-check/contents.txt
          grep -qx 'package/scripts/set-patrol-credential.ps1' .pack-check/contents.txt
          grep -qx 'package/docs/captcha-demo.md' .pack-check/contents.txt
          grep -qx 'package/docs/publishing.md' .pack-check/contents.txt
          grep -qx 'package/README.md' .pack-check/contents.txt
          grep -qx 'package/LICENSE' .pack-check/contents.txt
          grep -qx 'package/package.json' .pack-check/contents.txt

  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check browser extension
        run: pnpm check:extension

      - name: Check Python runtime syntax
        run: python -m py_compile browser-bridge-runtime/captcha-demo-solver.py browser-bridge-runtime/qr-decode.py excel-runtime/openxml_bridge.py

      - name: Check UTF-8 and Chinese text
        run: pnpm check:encoding

      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @('scripts/install-local.ps1', 'scripts/install-captcha-demo.ps1', 'scripts/uninstall-local.ps1', 'scripts/set-patrol-credential.ps1', 'scripts/dev.ps1', 'desktop-runtime/windows-desktop.ps1', 'tests/windows-desktop-fixture.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Error "$path has PowerShell syntax errors: $($errors | ForEach-Object Message | Out-String)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Execute Desktop Automation backend smoke
        shell: pwsh
        run: |
          $json = '{}'
          $payload = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          $output = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File desktop-runtime/windows-desktop.ps1 -Action list-windows -Payload $payload
          if ($LASTEXITCODE -ne 0) { throw "desktop runtime exited with $LASTEXITCODE : $output" }
          $value = $output | ConvertFrom-Json
          if ($value.ok -ne $true) { throw "desktop runtime smoke returned ok=false: $output" }
          if ($null -eq $value.windows) { throw "desktop runtime smoke did not return windows array: $output" }

      - name: Resolve friendly Start Apps without launching
        shell: pwsh
        run: |
          # Select the fixture through the same Windows PowerShell 5.1 process
          # used by the runtime. PowerShell 7 and 5.1 can expose different
          # Get-StartApps AppID representations on hosted runners.
          $probe = '$entry = Get-StartApps | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_.AppID) -and -not [string]::IsNullOrWhiteSpace([string]$_.Name) } | Select-Object -First 1; if ($null -eq $entry) { exit 3 }; $entry | Select-Object Name,AppID | ConvertTo-Json -Compress'
          $entryJson = & powershell.exe -NoProfile -NonInteractive -Command $probe
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell Get-StartApps probe exited with $LASTEXITCODE" }
          $entry = $entryJson | ConvertFrom-Json
          # Real Patrol calls use a friendly application name (for example
          # app="微信"), not the shell's internal AppID. AppID formatting can
          # differ between independent Windows PowerShell processes, while the
          # Start Apps display name is the stable public lookup key.
          $json = @{ app = [string]$entry.Name } | ConvertTo-Json -Compress
          $payload = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          $output = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File desktop-runtime/windows-desktop.ps1 -Action resolve-app -Payload $payload
          if ($LASTEXITCODE -ne 0) { throw "desktop app resolver exited with $LASTEXITCODE : $output" }
          $value = $output | ConvertFrom-Json
          if ($value.ok -ne $true) { throw "desktop app resolver returned ok=false: $output" }
          if ($value.spec.mode -ne 'shell-app') { throw "expected shell-app resolution for friendly name '$($entry.Name)': $output" }
          if ([string]$value.spec.resolvedName -ne [string]$entry.Name) { throw "resolved friendly-name mismatch: $output" }

      - name: Execute Desktop Automation UIA integration smoke
        shell: pwsh
        run: node tests/windows-desktop-integration.mjs

      - name: Build
        run: pnpm build
