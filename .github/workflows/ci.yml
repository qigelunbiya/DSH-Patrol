name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check browser extension
        run: pnpm check:extension

      - name: Check UTF-8 and Chinese text
        run: pnpm check:encoding

      - name: Build
        run: pnpm build

      - name: Pack smoke test
        run: |
          mkdir -p .pack-check
          pnpm pack --pack-destination .pack-check
          test -n "$(find .pack-check -name 'dsh-patrol-*.tgz' -print -quit)"
