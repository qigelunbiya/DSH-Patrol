name: Apply internal Patrol worker fix

on:
  push:
    branches:
      - fix/internal-patrol-workers-20260907

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/internal-patrol-workers-20260907
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refactor
        run: node scripts/apply-internal-worker-fix.mjs
      - name: Remove staging helpers
        run: rm scripts/apply-internal-worker-fix.mjs .github/workflows/apply-internal-worker-fix.yml
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Browser/runtime checks
        run: pnpm check:extension
      - name: Encoding checks
        run: pnpm check:encoding
      - name: Build
        run: pnpm build
      - name: Commit validated refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: keep Patrol workers internal"
          git push origin HEAD:fix/internal-patrol-workers-20260907
