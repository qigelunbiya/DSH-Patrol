name: Apply internal Patrol worker fix

on:
  push:
    branches:
      - fix/internal-patrol-workers-20260907

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/internal-patrol-workers-20260907
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply refactor
        run: |
          sed -i '/if (text.indexOf(from, i + from.length) >= 0) throw new Error/d' scripts/apply-internal-worker-fix.mjs
          node scripts/apply-internal-worker-fix.mjs
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'

          const lazyPath = 'tests/lazy-patrol-architecture.spec.ts'
          let lazy = await readFile(lazyPath, 'utf8')
          const lazyBefore = lazy
          lazy = lazy.split('\n').map(line => (
            line.includes("expect(installer).toContain('patrol") && line.includes('internal-workers')
              ? "    expect(installer).toContain('internal-workers')"
              : line
          )).join('\n')
          if (lazy === lazyBefore) throw new Error('lazy worker-root expectation was not updated')
          await writeFile(lazyPath, lazy, 'utf8')

          const dashboardPath = 'tests/dashboard-run-button.spec.ts'
          let dashboard = await readFile(dashboardPath, 'utf8')
          const oldExpectation = `    expect(managementHost).toContain("const RECOVERY_PRESET = 'patrol-recovery'")`
          const newExpectations = [
            `    expect(managementHost).toContain("internalPatrolWorkerPath(String(workerRoot || ''), 'recovery')")`,
            `    expect(managementHost).toContain("mountInternalPatrolWorker(agentCtx, compositionPath, 'recovery')")`,
            `    expect(managementHost).not.toContain("const RECOVERY_PRESET = 'patrol-recovery'")`,
            `    expect(managementHost).not.toContain("ctx.get('agentPresets')")`,
          ].join('\n')
          if (!dashboard.includes(oldExpectation)) throw new Error('legacy dashboard recovery preset expectation not found')
          dashboard = dashboard.replace(oldExpectation, newExpectations)
          await writeFile(dashboardPath, dashboard, 'utf8')
          NODE
      - name: Remove staging helpers
        run: rm scripts/apply-internal-worker-fix.mjs .github/workflows/apply-internal-worker-fix.yml
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Browser/runtime checks
        run: pnpm check:extension
      - name: Encoding checks
        run: pnpm check:encoding
      - name: Build
        run: pnpm build
      - name: Commit validated refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: keep Patrol workers internal"
          git push origin HEAD:fix/internal-patrol-workers-20260907
