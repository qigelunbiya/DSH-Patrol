name: Repair staging workflow bootstrap
on:
  push:
    branches:
      - fix/internal-worker-scope-mount-20260907
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/internal-worker-scope-mount-20260907
      - name: Remove unavailable lockfile cache assumption
        run: |
          sed -i '/^[[:space:]]*cache: pnpm$/d' .github/workflows/apply-internal-worker-scope-fix.yml
          git rm .github/workflows/repair-staging-workflow.yml
      - name: Commit workflow repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-internal-worker-scope-fix.yml .github/workflows/repair-staging-workflow.yml
          git commit -m "chore: repair internal worker fix workflow"
          git push origin HEAD:fix/internal-worker-scope-mount-20260907
