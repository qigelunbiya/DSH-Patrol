name: Repair staging workflow bootstrap v2
on:
  push:
    branches:
      - fix/internal-worker-scope-mount-20260907
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/internal-worker-scope-mount-20260907
          fetch-depth: 0
      - name: Repair workflow
        run: |
          sed -i '/^[[:space:]]*cache: pnpm$/d' .github/workflows/apply-internal-worker-scope-fix.yml
          git rm -f .github/workflows/repair-staging-workflow.yml .github/workflows/repair-staging-workflow-v2.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "chore: repair internal worker fix workflow"
          git push origin HEAD:fix/internal-worker-scope-mount-20260907
