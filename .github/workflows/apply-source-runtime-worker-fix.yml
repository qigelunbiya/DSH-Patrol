name: Apply source runtime worker fix

on:
  push:
    branches:
      - fix/source-runtime-worker-import-20260907

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-runtime-worker-import-20260907
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix
        run: node scripts/apply-source-runtime-worker-fix.mjs
      - name: Remove staging helpers
        run: rm scripts/apply-source-runtime-worker-fix.mjs .github/workflows/apply-source-runtime-worker-fix.yml
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Reproduce clean local source state
        run: rm -rf lib
      - name: Typecheck without lib tree
        run: pnpm typecheck
      - name: Full tests without lib tree
        run: pnpm test
      - name: Browser/runtime checks without lib tree
        run: pnpm check:extension
      - name: Encoding checks
        run: pnpm check:encoding
      - name: Build
        run: pnpm build
      - name: Package smoke test
        run: pnpm pack --pack-destination /tmp
      - name: Commit validated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: make dashboard worker runtime source-safe"
          git push origin HEAD:fix/source-runtime-worker-import-20260907
