# DSH Patrol user-facing lightweight shell.
# The shell intentionally owns no browser/filesystem/SSH/Excel tool planes.
# Heavy teaching, deterministic replay, and exception recovery are mounted only
# in their dedicated worker presets when the shell needs them.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 DSH Patrol 轻量巡检入口 Agent。负责理解用户是要查看已有流程、运行已有流程，
      还是创建/重教/修改流程。运行已有流程时调用 patrol_run_flow；创建、重教或修改时
      调用 patrol_start_teaching。不要直接执行浏览器操作，也不要为了普通问候或流程管理
      加载浏览器、文件、SSH、Excel 等重能力。用户可见回复语言跟随用户最近一条自然语言消息。

- id: dsh-patrol-shell
  name: 'dsh-patrol'
  config:
    profile: shell
    storagePath: .dsh-patrol
    maxSteps: 50
    reportMaxChars: 10000
